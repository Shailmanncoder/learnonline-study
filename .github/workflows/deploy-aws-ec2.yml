name: Deploy StudyHub to AWS EC2
# Triggered again after deployment setup
# Deployment retry after EC2 environment setup

on:
  push:
    branches:
      - updated-api
  workflow_dispatch:

concurrency:
  group: studyhub-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to study hub-server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
      APP_DIR: ${{ secrets.APP_DIR }}

    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for variable in EC2_HOST EC2_USER EC2_SSH_KEY EC2_KNOWN_HOSTS APP_DIR; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${variable}"
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail
          ssh             -i ~/.ssh/deploy_key             -o BatchMode=yes             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes             "$EC2_USER@$EC2_HOST"             bash -s -- "$APP_DIR" <<'REMOTE'
          set -euo pipefail

          APP_DIR="$1"
          cd "$APP_DIR"

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Deployment stopped: the server repository has uncommitted changes."
            exit 1
          fi

          if [[ ! -f backend/.env ]]; then
            echo "Deployment stopped: $APP_DIR/backend/.env is missing."
            exit 1
          fi

          if [[ ! -d model-cache ]]; then
            echo "Deployment stopped: $APP_DIR/model-cache is missing but the Dockerfile requires it."
            exit 1
          fi

          git pull --ff-only origin main
          docker compose config --quiet
          docker compose up -d --build --remove-orphans
          docker compose ps
          REMOTE

      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/deploy_key
